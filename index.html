<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIMAYATHUL ISLAM MADRASA | Portal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#10243d;--blue:#2563eb;--cyan:#16a6a1;--ink:#172b45;--muted:#718096;--line:#e8edf4;--bg:#f4f7fb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans Malayalam',sans-serif}.shell{max-width:1240px;margin:auto;padding:22px}.hero{background:linear-gradient(120deg,#0d2038,#174c76 62%,#157c82);color:#fff;border-radius:24px;padding:25px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 16px 36px #10243d20}.brand{font-weight:800;letter-spacing:.2px;font-size:19px}.sub{color:#c7d8e8;font-size:12px;margin-top:6px;letter-spacing:1.4px}.hero small{color:#d6e6f3}.login{max-width:430px;margin:9vh auto;background:#fff;padding:30px;border-radius:22px;box-shadow:0 18px 50px #173b6318}.login h2{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #dce4ee;border-radius:11px;font:inherit;background:#fff;margin:6px 0 13px;color:var(--ink)}textarea{min-height:92px}label{font-size:12px;font-weight:700;color:#53647b}button{border:0;background:var(--blue);color:#fff;padding:11px 16px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}.ghost{background:#edf3fa;color:#234568}.danger{background:#fff0f0;color:#ad3030}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.who{font-weight:800}.scope{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;text-align:left;min-height:145px;box-shadow:0 7px 22px #10243d08;transition:.18s}.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px #10243d12}.tile .ico{width:42px;height:42px;border-radius:13px;background:#eaf2ff;display:grid;place-items:center;font-size:21px;margin-bottom:15px}.tile h3{font-size:16px;margin:0 0 7px}.tile p{font-size:12px;color:var(--muted);margin:0;line-height:1.7}.section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:16px;box-shadow:0 7px 22px #10243d07}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.sectionhead h2{font-size:19px;margin:0}.back{background:#edf3fa;color:#234568}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);padding:17px;border-radius:16px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.list{border-top:1px solid var(--line)}.entry{padding:14px 2px;border-bottom:1px solid var(--line)}.entry strong{display:block;margin-bottom:5px}.entry small{color:var(--muted)}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#eaf4ff;color:#245b91;font-size:11px;font-weight:700}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f7f9fc;color:#53647b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.notice{background:#f0f7ff;border-left:4px solid var(--blue);padding:12px;border-radius:10px;font-size:13px;margin:12px 0}.classgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.classbox{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fbfdff}.classbox b{display:block;font-size:18px}.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.qrCard{border:1px solid var(--line);padding:14px;border-radius:15px;text-align:center}.qrbox{display:flex;justify-content:center;padding:10px}.status{font-size:13px;color:var(--blue);padding:8px 0}.error{color:#b42318}.footer{text-align:center;color:#9aa7b8;font-size:11px;padding:24px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.classgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.shell{padding:12px}.hero{padding:20px;border-radius:18px}.brand{font-size:16px}.grid{grid-template-columns:1fr 1fr;gap:9px}.tile{padding:14px;min-height:132px}.tile h3{font-size:13px}.tile p{font-size:11px}.formgrid{grid-template-columns:1fr}.section{padding:16px}.classgrid{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell"><header class="hero"><div><div class="brand">☪ HIMAYATHUL ISLAM MADRASA</div><div class="sub">NADUVATHUR · DIGITAL MANAGEMENT PORTAL</div></div><small>ADMINISTRATION</small></header>
<section id="login" class="login"><h2>സ്വാഗതം</h2><p class="muted">അഡ്മിൻ / അധ്യാപക QR വഴി പ്രവേശിക്കുക.</p><label>Access Token<input id="tokenInput" autocomplete="off" placeholder="Token നൽകുക"></label><button onclick="manualLogin()">പ്രവേശിക്കുക</button><div id="loginMsg" class="status"></div></section>
<div id="app" class="hidden"><div class="topbar"><div><div class="who" id="who"></div><div class="scope" id="scope"></div></div><button class="ghost" onclick="logout()">പുറത്തുകടക്കുക</button></div><div id="home"></div><div id="page" class="hidden"></div><div id="msg" class="status"></div></div><div class="footer">HIMAYATHUL ISLAM MADRASA · NADUVATHUR</div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzAHFgJynpZcqmwalkTPfocNu6piglgDmGRlqjfybV0CYaBNMbSN7FLOkmB0yiWR3Fa/exec';let token='',role='',teacher=null,data={},qrData=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*99999),s=document.createElement('script'),tm=setTimeout(()=>{clean();reject(Error('സെർവർ പ്രതികരിക്കുന്നില്ല.'))},25000);function clean(){clearTimeout(tm);s.remove();try{delete window[cb]}catch(e){}}window[cb]=r=>{clean();resolve(r)};s.onerror=()=>{clean();reject(Error('API ബന്ധിപ്പിക്കാൻ കഴിഞ്ഞില്ല.'))};s.src=API_URL+'?'+new URLSearchParams({action,callback:cb,...params});document.body.appendChild(s)})}
async function boot(){let q=new URLSearchParams(location.search);if(q.get('token')){token=q.get('token');role=q.get('role')==='admin'?'admin':'teacher';await auth()} }
function manualLogin(){token=$('tokenInput').value.trim();role='admin';if(token)auth();else $('loginMsg').textContent='Token നൽകുക.'}
async function auth(){try{let r=await api(role==='admin'?'adminLogin':'teacherLogin',{token});if(!r.ok)throw Error(r.message);teacher=r.teacher||null;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=teacher?teacher.name:'സ്വദർ മുഅല്ലിം';$('scope').textContent=teacher?'ക്ലാസ് '+teacher.className+' · അധ്യാപക പോർട്ടൽ':'എല്ലാ ക്ലാസുകളുടെയും നിയന്ത്രണം';await refresh();home()}catch(e){$('loginMsg').textContent=e.message}}
function logout(){location.href=location.pathname}async function refresh(){let r=await api(role==='admin'?'adminDashboard':'teacherDashboard',{token});if(!r.ok)throw Error(r.message);data=r}
function home(){ $('page').classList.add('hidden');$('home').classList.remove('hidden');if(teacher){$('home').innerHTML=`<div class="notice">ക്ലാസ് ${esc(teacher.className)} · നിങ്ങളുടെ ക്ലാസിലെ വിദ്യാർത്ഥികളുടെയും പ്രവർത്തനങ്ങളുടെയും വിവരങ്ങൾ മാത്രം.</div><div class="grid">${tile('🕌','നിസ്കാര റിപ്പോർട്ട്','വിദ്യാർത്ഥികളുടെ നിസ്കാര രേഖകൾ','prayer')}${tile('📚','പഠന പ്രവർത്തനങ്ങൾ','ചോദ്യങ്ങൾ, പാഠങ്ങൾ, ലിങ്കുകൾ, ക്വിസുകൾ','learning')}${tile('🏅','പരീക്ഷാഫലങ്ങൾ','വിഷയവും മാർക്കും രേഖപ്പെടുത്തുക','results')}${tile('📢','മറ്റ് അറിയിപ്പുകൾ','ക്ലാസിനുള്ള അറിയിപ്പുകൾ പ്രസിദ്ധീകരിക്കുക','notices')}${tile('🗓️','ടൈംടേബിൾ','സാധാരണയും പരീക്ഷാ ടൈംടേബിളും','timetable')}${tile('💬','വിദ്യാർത്ഥി അഭിപ്രായങ്ങൾ','ഓരോ വിദ്യാർത്ഥിക്കും അഭിപ്രായം ചേർക്കുക','feedback')}</div>`}else{$('home').innerHTML=`<div class="notice">സ്വദർ മുഅല്ലിം · എല്ലാ ക്ലാസുകളുടെയും വിവരങ്ങൾ ഒരിടത്ത്. ഓരോ വിഭാഗവും തുറന്ന് പ്രത്യേകം നിയന്ത്രിക്കാം.</div><div class="stats">${stat('വിദ്യാർത്ഥികൾ',(data.students||[]).length)}${stat('അധ്യാപകർ',(data.teachers||[]).length)}${stat('പഠന പ്രവർത്തനങ്ങൾ',(data.activities||[]).length)}${stat('അറിയിപ്പുകൾ',(data.notices||[]).length)}</div><div class="classgrid">${Array.from({length:8},(_,i)=>{let c=String(i+1),n=(data.students||[]).filter(s=>String(s.Class)===c).length,t=(data.teachers||[]).find(x=>String(x.Class)===c);return `<div class="classbox"><b>ക്ലാസ് ${c}</b><small>${n} വിദ്യാർത്ഥികൾ</small><p class="muted">${esc(t?.Name||'അധ്യാപകനെ ചേർത്തിട്ടില്ല')}</p><button class="ghost" onclick="openPage('class','${c}')">ക്ലാസ് തുറക്കുക →</button></div>`}).join('')}</div><div class="grid" style="margin-top:16px">${tile('👨‍🎓','വിദ്യാർത്ഥികൾ','പുതിയ വിദ്യാർത്ഥികൾ, പട്ടിക','students')}${tile('👨‍🏫','അധ്യാപകർ & QR','നിലവിലെ QR ലിങ്കുകൾ','teachers')}${tile('📚','പഠന പ്രവർത്തനങ്ങൾ','എല്ലാ ക്ലാസുകളിലെയും പ്രവർത്തനങ്ങൾ','learning')}${tile('📝','പരീക്ഷാഫലങ്ങൾ','പരീക്ഷയും മാർക്കും','results')}${tile('📢','അറിയിപ്പുകൾ','മദ്റസ / ക്ലാസ് അറിയിപ്പുകൾ','notices')}${tile('🗓️','ടൈംടേബിൾ','ക്ലാസ് ടൈംടേബിളുകൾ','timetable')}${tile('🕌','നിസ്കാര റിപ്പോർട്ട്','എല്ലാ ക്ലാസുകളുടെയും റിപ്പോർട്ട്','prayer')}${tile('💬','അഭിപ്രായങ്ങൾ','അധ്യാപകരുടെ അഭിപ്രായങ്ങൾ','feedback')}</div>`}}
function tile(i,t,d,k){return `<button class="tile" onclick="openPage('${k}')"><div class="ico">${i}</div><h3>${t}</h3><p>${d}</p></button>`}function stat(t,n){return `<div class="stat"><b>${n}</b><span>${t}</span></div>`}
function frame(title,body){$('home').classList.add('hidden');$('page').classList.remove('hidden');$('page').innerHTML=`<section class="section"><div class="sectionhead"><h2>${title}</h2><button class="back" onclick="home()">← പ്രധാന പേജ്</button></div>${body}</section>`}
function clsSelect(id='fclass',selected=''){return `<select id="${id}">${Array.from({length:8},(_,i)=>`<option ${String(i+1)===String(selected)?'selected':''} value="${i+1}">ക്ലാസ് ${i+1}</option>`).join('')}</select>`}function classFilter(c){return teacher?String(teacher.className)===String(c):true}
async function openPage(k,arg=''){try{if(k==='class'){frame('ക്ലാസ് '+arg,`<div class="grid">${tile('👨‍🎓','വിദ്യാർത്ഥികൾ','ഈ ക്ലാസിലെ കുട്ടികൾ','students')}${tile('🕌','നിസ്കാര റിപ്പോർട്ട്','ക്ലാസ് റിപ്പോർട്ട്','prayer')}${tile('📚','പഠന പ്രവർത്തനങ്ങൾ','ക്ലാസ് പ്രവർത്തനങ്ങൾ','learning')}${tile('🗓️','ടൈംടേബിൾ','ക്ലാസ് ടൈംടേബിൾ','timetable')}</div>`);return}
if(k==='students'){let arr=(data.students||[]).filter(s=>classFilter(s.Class));frame('വിദ്യാർത്ഥികൾ',`<div class="formgrid"><label>അഡ്മിഷൻ ID<input id="sid"></label><label>വിദ്യാർത്ഥിയുടെ പേര്<input id="sname"></label><label>ക്ലാസ്${clsSelect('sclass',teacher?.className||1)}</label><label>രക്ഷിതാവിന്റെ പേര്<input id="parent"></label><label>ഫോൺ<input id="phone"></label><label>Gender<input id="gender"></label></div><button onclick="saveStudent()">വിദ്യാർത്ഥിയെ സേവ് ചെയ്യുക</button><div class="list" style="margin-top:18px">${arr.map(s=>entry(`${s.Name} · ${s.ID}`,`ക്ലാസ് ${s.Class} · ${s.Phone||''}`)).join('')}</div>`)}
else if(k==='teachers'){if(teacher)throw Error('അഡ്മിൻ വിഭാഗം മാത്രം.');frame('അധ്യാപകർ & QR കോഡുകൾ',`<div class="actions"><button onclick="window.print()">QR പ്രിന്റ് ചെയ്യുക</button><button class="ghost" onclick="loadQR()">QR പുതുക്കി കാണിക്കുക</button></div><div id="qrgrid" class="qrgrid"></div><div class="list">${(data.teachers||[]).map(t=>entry('ക്ലാസ് '+t.Class+' · '+t.Name,t.Status||'Active')).join('')}</div>`);await loadQR()}
else if(k==='learning'){let acts=(data.activities||[]).filter(a=>classFilter(a.Class));frame('പഠന പ്രവർത്തനങ്ങൾ',`${!teacher?`<label>ക്ലാസ്${clsSelect('fclass')}</label>`:''}<div class="actions"><button onclick="activityForm()">＋ പുതിയ പ്രവർത്തനം സൃഷ്ടിക്കുക</button></div><div id="activityForm"></div><div class="list">${acts.map(a=>entry(a.Title,`ക്ലാസ് ${a.Class} · ${a.Type} · ${(a.responses||[]).length} മറുപടികൾ`+(a.Content?`<p>${esc(a.Content)}</p>`:'' )+(a.responses||[]).map(x=>`<p class="muted">${esc(x['Student Name'])}: ${esc(x.Answer)}</p>`).join(''))).join('')||'<p class="muted">പ്രവർത്തനങ്ങളില്ല.</p>'}</div>`)}
else if(k==='results'){let exams=(data.exams||[]).filter(e=>classFilter(e.Class));frame('പരീക്ഷാഫലങ്ങൾ',`${!teacher?`<label>ക്ലാസ്${clsSelect('eclass')}</label>`:''}<div class="formgrid"><label>പരീക്ഷയുടെ പേര്<input id="etitle"></label><label>വിഷയം<input id="subject"></label><label>പരീക്ഷ തീയതി<input type="date" id="edate"></label><label>പരമാവധി മാർക്ക്<input id="maxmarks" type="number" value="100"></label></div><button onclick="createExam()">പരീക്ഷ ചേർക്കുക</button><hr><label>പരീക്ഷ തിരഞ്ഞെടുക്കുക<select id="examPick">${exams.map(e=>`<option value="${esc(e['Exam ID'])}">${esc(e.Title)} · ${esc(e.Class)}</option>`).join('')}</select></label><div class="formgrid"><label>വിദ്യാർത്ഥിയുടെ ID<input id="resultStudent"></label><label>മാർക്ക്<input id="marks" type="number"></label><label>അഭിപ്രായം<input id="remarks"></label></div><button onclick="saveResult()">മാർക്ക് സേവ് ചെയ്യുക</button><div class="list">${(data.results||[]).filter(x=>classFilter(x.Class)).map(x=>entry(x['Student Name']+' · '+x.Subject,x.Marks+'/'+x['Max Marks'])).join('')}</div>`)}
else if(k==='notices'){let ns=(data.notices||[]).filter(n=>!teacher||n['Target Type']==='All'||String(n['Target Class'])===String(teacher.className));frame('അറിയിപ്പുകൾ',`${!teacher?`<label>ലക്ഷ്യ ക്ലാസ്${clsSelect('nclass')}</label>`:''}<label>തലക്കെട്ട്<input id="ntitle"></label><label>അറിയിപ്പ്<textarea id="nmessage"></textarea></label><button onclick="createNotice()">പ്രസിദ്ധീകരിക്കുക</button><h3>പ്രസിദ്ധീകരിച്ച അറിയിപ്പുകൾ</h3><div class="list">${ns.map(n=>`<div class="entry"><strong>${esc(n.Title)}</strong><small>${esc(n.Message)}</small><small>ലൈക്ക്: ${(n.likes||0)} · കമന്റുകൾ: ${(n.comments||[]).length}</small>${(n.comments||[]).map(c=>`<p class="muted">${esc(c['Student Name'])}: ${esc(c.Comment)}</p>`).join('')}<button class="ghost" onclick="editNoticeForm('${esc(n['Notice ID'])}')">എഡിറ്റ്</button></div>`).join('')||'<p class="muted">അറിയിപ്പുകളില്ല.</p>'}</div><div id="editNoticeBox"></div>`)}
else if(k==='timetable'){frame('ടൈംടേബിൾ',`${!teacher?`<label>ക്ലാസ്${clsSelect('fclass')}</label>`:''}<div class="notice">ആദ്യം സ്ഥിരം ടൈംടേബിൾ, അതിന് താഴെ പരീക്ഷാ ടൈംടേബിൾ കാണാം.</div><h3>സ്ഥിരം ടൈംടേബിൾ</h3><div class="list">${(data.timetables||[]).filter(x=>classFilter(x.Class)&&x.Type==='regular').map(x=>entry(x['Day/Date']+' · '+x.Subject,x.Time+' · ക്ലാസ് '+x.Class)).join('')}</div><h3>പരീക്ഷാ ടൈംടേബിൾ</h3><div class="list">${(data.timetables||[]).filter(x=>classFilter(x.Class)&&x.Type==='exam').map(x=>entry(x['Exam Type']+' · '+x['Day/Date']+' · '+x.Subject,x.Time+' · ക്ലാസ് '+x.Class)).join('')}</div><hr><h3>പുതിയ ടൈംടേബിൾ ചേർക്കുക</h3>${!teacher?`<label>ക്ലാസ്${clsSelect('ttclass')}</label>`:''}<label>തരം<select id="ttype" onchange="toggleExamType()"><option value="regular">സ്ഥിരം ടൈംടേബിൾ</option><option value="exam">പരീക്ഷാ ടൈംടേബിൾ</option></select></label><div id="examTypeWrap" class="hidden"><label>പരീക്ഷ<select id="examType"><option>പാദവാർഷിക പരീക്ഷ</option><option>അർദ്ധവാർഷിക പരീക്ഷ</option><option>വാർഷിക പരീക്ഷ</option></select></label></div><div class="formgrid"><label>ദിവസം / തീയതി<input id="dayDate" placeholder="തിങ്കൾ / 2026-12-01"></label><label>വിഷയം<input id="ttsubject"></label><label>സമയം<input id="tttime" placeholder="10:00 - 10:45"></label></div><button onclick="saveTimetable()">ചേർക്കുക</button>`)}
else if(k==='prayer'){let arr=(data.prayers||[]).filter(p=>classFilter(p.Class));let kids=(data.students||[]).filter(s=>classFilter(s.Class));let names=['Dhuhr','Asr','Maghrib','Isha','Fajr'],labels=['ളുഹർ','അസർ','മഗ്‌രിബ്','ഇശാ','സുബഹി'];let byId={};arr.forEach(p=>byId[String(p['Student ID'])]=p);frame('നിസ്കാര റിപ്പോർട്ട്',`<div class="notice">ഇന്നലത്തെ നാല് നിസ്കാരങ്ങളും ഇന്നത്തെ സുബഹിയും · പട്ടിക വശത്തേക്ക് സ്ക്രോൾ ചെയ്യാം.</div><div style="overflow-x:auto;max-width:100%;border:1px solid #e4ebf4;border-radius:14px"><table style="min-width:760px;width:100%;border-collapse:collapse"><thead><tr><th>വിദ്യാർത്ഥി</th>${labels.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${kids.map(k=>{let p=byId[String(k.ID)]||{};return `<tr><td>${esc(k.Name)}</td>${names.map(x=>`<td style="text-align:center">${String(p[x]).toLowerCase()==='true'?'✅':'—'}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`)}
else if(k==='feedback'){let st=(data.students||[]).filter(s=>classFilter(s.Class));frame('വിദ്യാർത്ഥികളുടെ അഭിപ്രായങ്ങൾ',`<label>വിദ്യാർത്ഥി<select id="fbstudent">${st.map(s=>`<option value="${esc(s.ID)}">${esc(s.Name)} · ${esc(s.ID)}</option>`).join('')}</select></label><label>പ്രീസെറ്റ് അഭിപ്രായം<select id="preset" onchange="if(this.value)$('comment').value=this.value"><option value="">തിരഞ്ഞെടുക്കുക</option>${['പഠനത്തിൽ നല്ല പുരോഗതി കാണിക്കുന്നു.','കൂടുതൽ ശ്രദ്ധയും പരിശീലനവും ആവശ്യമാണ്.','നല്ല അച്ചടക്കവും പെരുമാറ്റവും പുലർത്തുന്നു.','പാഠങ്ങൾ കൃത്യമായി പഠിച്ചുവരുന്നു.','കൂടുതൽ വായനാശീലം വളർത്തണം.','നിസ്കാര കാര്യങ്ങളിൽ കൂടുതൽ ശ്രദ്ധിക്കണം.'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>അഭിപ്രായം<textarea id="comment" placeholder="സ്വന്തമായി അഭിപ്രായം എഴുതാം..."></textarea></label><button onclick="saveFeedback()">അഭിപ്രായം പ്രസിദ്ധീകരിക്കുക</button><div class="list">${(data.feedback||[]).filter(x=>classFilter(x.Class)).map(x=>entry(x['Student Name'],x.Comment)).join('')}</div>`)}
}catch(e){say(e.message,true)}}
function entry(a,b){return `<div class="entry"><strong>${esc(a)}</strong><small>${esc(b)}</small></div>`}
function activityForm(){$('activityForm').innerHTML=`<div class="section" style="margin:12px 0;background:#f8fbff"><h3>പുതിയ പഠന പ്രവർത്തനം</h3>${!teacher?`<label>ക്ലാസ്${clsSelect('aclass')}</label>`:''}<div class="formgrid"><label>തരം<select id="atype"><option value="yesno">അതെ / ഇല്ല ചോദ്യം</option><option value="text">എഴുത്ത് ഉത്തരം</option><option value="choice">MCQ / ക്വിസ്</option><option value="lesson">പാഠവും അർത്ഥവും</option><option value="link">ലിങ്ക്</option><option value="game">ഗെയിം / പഠന കളി</option></select></label><label>തലക്കെട്ട്<input id="atitle"></label></div><label>ചോദ്യം / പാഠം / വിവരണം / ലിങ്ക്<textarea id="acontent"></textarea></label><label>ഓപ്ഷനുകൾ (MCQ ആണെങ്കിൽ | ഉപയോഗിച്ച് വേർതിരിക്കുക)<input id="aoptions" placeholder="A|B|C|D"></label><label>അവസാന തീയതി<input id="adue" type="date"></label><button onclick="saveActivity()">പ്രസിദ്ധീകരിക്കുക</button></div>`}
function toggleExamType(){$('examTypeWrap').classList.toggle('hidden',$('ttype').value!=='exam')}
async function saveActivity(){let r=await api('saveActivity',{token,className:teacher?.className||$('aclass')?.value||'1',type:$('atype').value,title:$('atitle').value,content:$('acontent').value,options:$('aoptions').value,dueDate:$('adue').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('learning')}}
async function saveTimetable(){let r=await api('saveTimetable',{token,className:teacher?.className||$('ttclass')?.value||'1',type:$('ttype').value,examType:$('examType')?.value||'',dayDate:$('dayDate').value,subject:$('ttsubject').value,time:$('tttime').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('timetable')}}
async function saveFeedback(){let r=await api('saveFeedback',{token,studentId:$('fbstudent').value,comment:$('comment').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('feedback')}}
async function saveStudent(){let r=await api('saveStudent',{token,id:$('sid').value,name:$('sname').value,className:$('sclass').value,gender:$('gender').value,parentName:$('parent').value,phone:$('phone').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('students')}}
async function createExam(){let r=await api('createExam',{token,title:$('etitle').value,className:teacher?.className||$('eclass')?.value||$('fclass')?.value||'1',subject:$('subject').value,examDate:$('edate').value,maxMarks:$('maxmarks').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('results')}}
async function saveResult(){let r=await api('saveResult',{token,examId:$('examPick').value,studentId:$('resultStudent').value,marks:$('marks').value,remarks:$('remarks').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('results')}}
async function editNoticeForm(id){let n=(data.notices||[]).find(x=>String(x['Notice ID'])===String(id));if(!n)return;$('editNoticeBox').innerHTML=`<div class="section"><h3>അറിയിപ്പ് എഡിറ്റ് ചെയ്യുക</h3><label>തലക്കെട്ട്<input id="editNTitle" value="${esc(n.Title)}"></label><label>അറിയിപ്പ്<textarea id="editNMessage">${esc(n.Message)}</textarea></label><button onclick="saveNoticeEdit('${esc(id)}')">മാറ്റം സേവ് ചെയ്യുക</button></div>`}
async function saveNoticeEdit(id){let r=await api('editNotice',{token,noticeId:id,title:$('editNTitle').value,message:$('editNMessage').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('notices')}}
async function createNotice(){let r=await api('createNotice',{token,title:$('ntitle').value,message:$('nmessage').value,targetType:teacher?'Class':'Class',targetClass:teacher?.className||$('nclass')?.value||'1'});say(r.message,!r.ok);if(r.ok){await refresh();openPage('notices')}}
async function loadQR(){let r=await api('getQRLinks',{token});if(!r.ok)throw Error(r.message);qrData=r;let host=$('qrgrid');if(!host)return;host.innerHTML='';let list=[{name:'സ്വദർ മുഅല്ലിം',url:r.superAdmin?.url},...(r.teachers||[]).map(x=>({name:'ക്ലാസ് '+x.className+' · '+x.name,url:x.url}))];list.forEach(x=>{let d=document.createElement('div');d.className='qrCard';d.innerHTML=`<b>${esc(x.name)}</b><div class="qrbox"></div>`;host.appendChild(d);if(x.url&&window.QRCode)new QRCode(d.querySelector('.qrbox'),{text:x.url,width:120,height:120})})}
function say(t,e=false){$('msg').textContent=t;$('msg').classList.toggle('error',e)}boot();
</script></body></html>
