<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243d"><title>HIMAYATHUL ISLAM MADRASA | Admin Portal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#10243d;--blue:#2563eb;--teal:#0f8b83;--ink:#172b45;--muted:#718096;--line:#e7edf4;--bg:#f3f6fb;--white:#fff;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans Malayalam',sans-serif}.shell{max-width:1240px;margin:auto;padding:22px}.hero{background:linear-gradient(120deg,#0d2038,#174c76 62%,#157c82);color:#fff;border-radius:24px;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 16px 36px #10243d20}.brand{font-weight:800;font-size:19px}.sub{color:#c7d8e8;font-size:11px;margin-top:6px;letter-spacing:1.3px}.hero small{color:#d6e6f3}.login{max-width:430px;margin:9vh auto;background:#fff;padding:30px;border-radius:22px;box-shadow:0 18px 50px #173b6318}.login h2{margin:0 0 8px}.muted{color:var(--muted);font-size:12px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dce4ee;border-radius:10px;font:inherit;background:#fff;margin:6px 0 12px;color:var(--ink)}textarea{min-height:85px}label{font-size:12px;font-weight:700;color:#53647b}button{border:0;background:var(--blue);color:#fff;padding:10px 14px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:wait}.ghost{background:#edf3fa;color:#234568}.danger{background:#fff0f0;color:#ad3030}.success{background:#e8f7f2;color:#08785f}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.who{font-weight:800}.scope{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;min-height:135px;box-shadow:0 7px 22px #10243d08;transition:.18s}.tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px #10243d12}.tile .ico{width:40px;height:40px;border-radius:12px;background:#eaf2ff;display:grid;place-items:center;font-size:20px;margin-bottom:12px}.tile h3{font-size:15px;margin:0 0 6px}.tile p{font-size:11px;color:var(--muted);margin:0;line-height:1.6}.section{background:#fff;border:1px solid var(--line);border-radius:19px;padding:21px;margin-top:15px;box-shadow:0 7px 22px #10243d07}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.sectionhead h2{font-size:18px;margin:0}.back{background:#edf3fa;color:#234568}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:15px 0}.stat{background:#fff;border:1px solid var(--line);padding:15px;border-radius:15px}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 13px}.list{border-top:1px solid var(--line)}.entry{padding:13px 2px;border-bottom:1px solid var(--line)}.entry strong{display:block;margin-bottom:4px}.entry small{color:var(--muted)}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#eaf4ff;color:#245b91;font-size:10px;font-weight:700}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}th{background:#f7f9fc;color:#53647b;white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.notice{background:#f0f7ff;border-left:4px solid var(--blue);padding:11px;border-radius:9px;font-size:12px;margin:10px 0}.classgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.classbox{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.classbox b{display:block;font-size:17px}.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px}.qrCard{border:1px solid var(--line);padding:13px;border-radius:14px;text-align:center}.qrbox{display:flex;justify-content:center;padding:9px}.status{font-size:12px;color:var(--blue);padding:8px 0;min-height:24px}.error{color:var(--red)}.daycard{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;background:#fbfdff}.daycard h4{margin:0 0 8px}.subjectrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.subjectrow input{margin:3px 0}.subjectrow button{padding:8px 10px}.subjline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #edf1f6;font-size:12px}.subjline:last-child{border:0}.inline{display:flex;gap:9px;align-items:center}.inline>*{flex:1}.section h3{font-size:15px}.footer{text-align:center;color:#9aa7b8;font-size:10px;padding:22px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.classgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.shell{padding:12px}.hero{padding:19px;border-radius:18px}.brand{font-size:16px}.grid{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:13px;min-height:126px}.tile h3{font-size:12px}.tile p{font-size:10px}.formgrid{grid-template-columns:1fr}.section{padding:15px}.classgrid{grid-template-columns:1fr 1fr}.subjectrow{grid-template-columns:1fr auto}.subjectrow button{grid-column:auto}}
</style></head><body><main class="shell"><header class="hero"><div><div class="brand">☪ HIMAYATHUL ISLAM MADRASA</div><div class="sub">NADUVATHUR · DIGITAL MANAGEMENT PORTAL</div></div><small>ADMINISTRATION</small></header>
<section id="login" class="login"><h2>Admin / Teacher Login</h2><p class="muted">Enter your access token or open your assigned QR link.</p><label>Access Token<input id="tokenInput" autocomplete="off" placeholder="Access token"></label><button onclick="manualLogin()">Sign In</button><div id="loginMsg" class="status"></div></section>
<div id="app" class="hidden"><div class="topbar"><div><div class="who" id="who"></div><div class="scope" id="scope"></div></div><button class="ghost" onclick="logout()">Logout</button></div><div id="home"></div><div id="page" class="hidden"></div><div id="msg" class="status"></div></div><div class="footer">HIMAYATHUL ISLAM MADRASA · NADUVATHUR</div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzAHFgJynpZcqmwalkTPfocNu6piglgDmGRlqjfybV0CYaBNMbSN7FLOkmB0yiWR3Fa/exec';let token='',role='',teacher=null,data={},currentSchedule='';
const SUBJECTS=['ദീനിയാത്ത്','അഖ്‌ലാഖ്','ഇംലാഅ്','വായന','എഴുത്ത്','തിലാവത്ത് മൂല്യനിർണയം','ഫിഖ്ഹ്','ദുറൂസുൽ ഇഹ്‌സാൻ','അഖീദ','ചരിത്രം','ലിസാനുൽ ഖുർആൻ','തജ്‌വീദ്','തഫ്സീർ','ഖുർആൻ','ഹിഫ്‌ള്','തിലാവത്ത് പരിശീലനം'];
const DAYS=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'];const EXAMS=['പാദവാർഷിക പരീക്ഷ','അർദ്ധവാർഷിക പരീക്ഷ','വാർഷിക പരീക്ഷ'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*99999),s=document.createElement('script'),tm=setTimeout(()=>{clean();reject(Error('Server did not respond.'))},25000);function clean(){clearTimeout(tm);s.remove();try{delete window[cb]}catch(e){}}window[cb]=r=>{clean();resolve(r)};s.onerror=()=>{clean();reject(Error('Could not connect to API.'))};s.src=API_URL+'?'+new URLSearchParams({action,callback:cb,...params});document.body.appendChild(s)})}
async function boot(){const q=new URLSearchParams(location.search);if(q.get('token')){token=q.get('token');role=q.get('role')==='admin'?'admin':'teacher';await auth()}}
function manualLogin(){token=$('tokenInput').value.trim();role='admin';if(token)auth();else $('loginMsg').textContent='Enter access token.'}
async function auth(){try{const r=await api(role==='admin'?'adminLogin':'teacherLogin',{token});if(!r.ok)throw Error(r.message);teacher=r.teacher||null;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=teacher?teacher.name:'Sadr Muallim';$('scope').textContent=teacher?'Class '+teacher.className+' · Teacher Portal':'All Classes · Administration';await refresh();home()}catch(e){$('loginMsg').textContent=e.message}}
function logout(){location.href=location.pathname}async function refresh(){const r=await api(role==='admin'?'adminDashboard':'teacherDashboard',{token});if(!r.ok)throw Error(r.message);data=r}
function home(){$('page').classList.add('hidden');$('home').classList.remove('hidden');if(teacher){$('home').innerHTML=`<div class="notice">Class ${esc(teacher.className)} · Manage your class records and student activities.</div><div class="grid">${tile('🕌','Prayer Report','Daily and monthly prayer records','prayer')}${tile('📚','Learning Activities','Yes/No, MCQ and lessons','learning')}${tile('🧩','Quiz Programs','MCQ and descriptive programs','programs')}${tile('🏅','Exam Results','Enter subject-wise marks','results')}${tile('📢','Class Notice','Publish and update the class notice','notices')}${tile('🗓️','Timetable','Regular timetable and exam schedules','timetable')}${tile('💬','Teachers’ Comments','Manage student feedback','feedback')}</div><div class="section" style="margin-top:16px"><h3>Notice Activity · Class ${esc(teacher.className)}</h3><div id="noticeActivityHome">${noticeActivityMarkup(data.noticeActivity||[])}</div></div>`}else{$('home').innerHTML=`<div class="notice">Sadr Muallim · Central administration for all classes.</div><div class="stats">${stat('Students',(data.students||[]).length)}${stat('Teachers',(data.teachers||[]).length)}${stat('Learning Activities',(data.activities||[]).length)}${stat('Active Notices',(data.notices||[]).filter(n=>n.Status==='Active').length)}</div><div class="classgrid">${Array.from({length:8},(_,i)=>{const c=String(i+1),n=(data.students||[]).filter(s=>String(s.Class)===c).length,t=(data.teachers||[]).find(x=>String(x.Class)===c);return `<div class="classbox"><b>Class ${c}</b><small>${n} students</small><p class="muted">${esc(t?.Name||'Teacher not assigned')}</p><button class="ghost" onclick="openPage('class','${c}')">Open Class →</button></div>`}).join('')}</div><div class="grid" style="margin-top:15px">${tile('👨‍🎓','Students','Student records','students')}${tile('👨‍🏫','Teachers & QR','Teacher details and QR links','teachers')}${tile('📚','Learning Activities','Yes/No, MCQ and lessons','learning')}${tile('🧩','Quiz Programs','MCQ and descriptive programs','programs')}${tile('📝','Exam Results','Exams and subject marks','results')}${tile('📢','Class Notices','One active notice per class','notices')}${tile('🗓️','Timetable','Regular and exam timetables','timetable')}${tile('🕌','Prayer Reports','Daily and monthly reports','prayer')}${tile('💬','Teachers’ Comments','Student feedback','feedback')}</div><div class="section" style="margin-top:16px"><h3>Notice Activity · All Classes</h3><div id="noticeActivityHome">${noticeActivityMarkup(data.noticeActivity||[])}</div></div>`}}
function noticeActivityMarkup(items){if(!items.length)return '<div class="empty">No active class notices or reactions yet.</div>';return items.map((x,i)=>{const n=x.notice||{};return `<div class="entry"><strong>Class ${esc(n['Target Class'])} · ${esc(n.Title||'Notice')}</strong><p class="muted">♥ ${Number(x.likeCount||0)} likes · 💬 ${Number(x.commentCount||0)} comments</p><button class="ghost" onclick="showNoticeActivity(${i})">View Activity</button></div>`}).join('')}
function showNoticeActivity(i){const items=data.noticeActivity||[],x=items[i];if(!x)return;const n=x.notice||{};const likes=x.likes||[],comments=x.comments||[];const html=`<div class="section"><div class="sectionhead"><h3>Class ${esc(n['Target Class'])} · ${esc(n.Title||'Notice')}</h3><button class="ghost" onclick="home()">Close</button></div><p>${esc(n.Message||'')}</p><h4>Likes (${likes.length})</h4>${likes.length?likes.map(v=>`<div class="entry">${esc(v['Student Name'])} · ${esc(v['Student ID'])}</div>`).join(''):'<p class="muted">No likes yet.</p>'}<h4>Comments (${comments.length})</h4>${comments.length?comments.map(v=>`<div class="entry"><b>${esc(v['Student Name'])} · ${esc(v['Student ID'])}</b><p>${esc(v.Comment)}</p><small class="muted">${esc(v['Created At']||'')}</small></div>`).join(''):'<p class="muted">No comments yet.</p>'}</div>`;frame('Notice Activity',html)}
function tile(i,t,d,k){return `<button class="tile" onclick="openPage('${k}')"><div class="ico">${i}</div><h3>${t}</h3><p>${d}</p></button>`}function stat(t,n){return `<div class="stat"><b>${n}</b><span>${t}</span></div>`}function frame(title,body){$('home').classList.add('hidden');$('page').classList.remove('hidden');$('page').innerHTML=`<section class="section"><div class="sectionhead"><h2>${title}</h2><button class="back" onclick="home()">← Dashboard</button></div>${body}</section>`}function clsSelect(id='fclass',selected=''){return `<select id="${id}">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${String(i+1)===String(selected)?'selected':''}>Class ${i+1}</option>`).join('')}</select>`}function classFilter(c){return teacher?String(teacher.className)===String(c):true}function selectedClass(id='fclass'){return teacher?String(teacher.className):($(id)?.value||'1')}function confirmDelete(message){return window.confirm(message||'Are you sure you want to delete this item?')}
async function openPage(k,arg=''){try{if(k==='class'){frame('Class '+arg,`<div class="grid">${tile('👨‍🎓','Students','Class students','students')}${tile('🕌','Prayer Report','Class prayer report','prayer')}${tile('📚','Learning Activities','Class activities','learning')}${tile('🗓️','Timetable','Class timetable','timetable')}</div>`);return}
if(k==='students'){const arr=(data.students||[]).filter(s=>classFilter(s.Class));frame('Students',`${!teacher?`<label>Class${clsSelect('sclass')}</label>`:''}<div class="formgrid"><label>Admission ID<input id="sid"></label><label>Student Name<input id="sname"></label>${!teacher?`<label>Class${clsSelect('snewclass')}</label>`:''}<label>Parent Name<input id="parent"></label><label>Phone<input id="phone"></label><label>Gender<input id="gender"></label></div><button onclick="saveStudent()">Save Student</button><div class="list" style="margin-top:15px">${arr.map(s=>entry(`${s.Name} · ${s.ID}`,`Class ${s.Class} · ${s.Phone||''}`)).join('')}</div>`)}
else if(k==='teachers'){if(teacher)throw Error('Admin access only.');frame('Teachers & QR Codes',`<div class="actions"><button onclick="window.print()">Print QR Codes</button><button class="ghost" onclick="loadQR()">Refresh QR Codes</button></div><div id="qrgrid" class="qrgrid"></div><div class="list">${(data.teachers||[]).map(t=>entry('Class '+t.Class+' · '+t.Name,t.Status||'Active')).join('')}</div>`);await loadQR()}
else if(k==='notices'){const cls=selectedClass('nclass');const n=(data.notices||[]).find(x=>String(x['Target Class'])===cls&&String(x.Status||'Active')==='Active');frame('Class Notice',`${!teacher?`<label>Class${clsSelect('nclass',cls)}</label>`:''}<div id="noticeEditor">${n?`<div class="notice"><b>Current Notice</b><h3>${esc(n.Title)}</h3><p>${esc(n.Message)}</p><div class="actions"><button class="ghost" onclick="editNotice('${esc(n['Notice ID'])}')">Edit Notice</button><button class="danger" onclick="removeNotice('${esc(n['Notice ID'])}')">Delete Notice</button></div></div>`:`<div class="empty">No active notice for this class.</div>`}<h3>${n?'Update Notice':'Create Notice'}</h3><label>Notice Title<input id="ntitle" value="${esc(n?.Title||'')}"></label><label>Notice Text<textarea id="nmessage">${esc(n?.Message||'')}</textarea></label><label>Optional Link Title<input id="nlinktitle" placeholder="Open study material"></label><label>Optional Link URL<input id="nlinkurl" placeholder="https://example.com"></label><div class="actions"><button onclick="saveNotice('${esc(n?.['Notice ID']||'')}')">${n?'Update Notice':'Publish Notice'}</button></div><p class="muted">Only one active notice is maintained for each class. Publishing again updates the existing notice.</p></div>`)}
else if(k==='prayer'){const cls=selectedClass('pclass');const month=new Date().toISOString().slice(0,7);const today=new Date();const localToday=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);frame('Prayer Reports',`${!teacher?`<label>Class${clsSelect('pclass',cls)}</label>`:''}<div class="section"><div class="sectionhead"><h2>Daily Prayer Report</h2><span class="pill">Daily</span></div><label>Select Date<input id="pdaily" type="date" value="${localToday}" onchange="renderPrayerReport()"></label><div id="dailyPrayerReport"></div></div><div class="section"><div class="sectionhead"><h2>Monthly / Overall Prayer Report</h2><span class="pill">Summary</span></div><div class="inline"><label>Report Period<select id="prange" onchange="renderPrayerReport()"><option value="month">Selected Month</option><option value="all">All Records</option></select></label><label>Month<input id="pmonth" type="month" value="${month}" onchange="renderPrayerReport()"></label></div><div id="prayerReport"></div></div>`);if($('pclass'))$('pclass').onchange=renderPrayerReport;renderPrayerReport()}
else if(k==='timetable'){const cls=selectedClass('ttclass');frame('Timetable Management',`${!teacher?`<label>Class${clsSelect('ttclass',cls)}</label>`:''}<div class="notice">Regular timetable: six days, up to three subjects per day. Empty slots are displayed as Not Set.</div><div class="section"><h3>Regular Timetable</h3><div id="regularEditor"></div></div><div class="section"><div class="sectionhead"><h3>Exam Timetables</h3><button type="button" onclick="showExamScheduleCreator()">＋ Create Exam Timetable</button></div>${!teacher?`<label>Class${clsSelect('examClass',cls)}</label>`:''}<div id="examScheduleCreator" class="notice hidden"><h4>Create New Exam Timetable</h4><label>Select Examination<select id="newExamType"><option value="">Choose examination</option>${EXAMS.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><div class="actions"><button type="button" onclick="createSchedule()">Create Timetable</button><button type="button" class="ghost" onclick="$('examScheduleCreator').classList.add('hidden')">Cancel</button></div></div><div id="examScheduleList"></div></div>`);renderRegularTimetable();renderExamSchedules()}
else if(k==='results'){const cls=selectedClass('rclass');frame('Exam Results',`${!teacher?`<label>Step 1 · Select Class<select id="rclass" onchange="renderResultSteps();renderResults()"><option value="">Choose a class</option>${Array.from({length:8},(_,i)=>`<option value="${i+1}">Class ${i+1}</option>`).join('')}</select></label>`:''}<div class="section"><h3>Add Result</h3><div class="notice">Complete each step in order. After saving, the same student remains selected for the next subject.</div><div id="resultSteps"></div></div><h3>Saved Results</h3><div id="resultList"></div>`);renderResultSteps();if($('rclass'))$('rclass').onchange=()=>{renderResultSteps();renderResults()};renderResults()}
else if(k==='feedback'){const arr=(data.feedback||[]).filter(x=>classFilter(x.Class)&&String(x.Status||'Active')==='Active');const st=(data.students||[]).filter(s=>classFilter(s.Class));frame('Teachers’ Comments',`${!teacher?`<label>Class${clsSelect('fbclass')}</label>`:''}<label>Select Student<select id="fbstudent">${st.map(s=>`<option value="${esc(s.ID)}">${esc(s.Name)} · ${esc(s.ID)}</option>`).join('')}</select></label><label>Comment<textarea id="comment" placeholder="Enter student feedback"></textarea></label><button onclick="saveFeedback()">Publish Comment</button><div id="feedbackList" class="list" style="margin-top:15px">${arr.map(f=>feedbackRow(f)).join('')||'<p class="muted">No comments yet.</p>'}</div>`)}
else if(k==='programs'){const progs=(data.programs||[]).filter(p=>classFilter(p.Class));frame('Quiz Programs',`<div class="actions"><button onclick="programForm()">＋ Create Program</button></div><div id="programFormHost"></div><div class="list">${progs.map(p=>`<div class="entry"><strong>${esc(p.Title)}</strong><small>${esc(p.Type)} · Class ${esc(p.Class)}</small><div class="actions"><button class="ghost" onclick="viewProgramParticipants('${esc(p['Program ID'])}')">Participants</button></div></div>`).join('')||'<p class="muted">No programs created.</p>'}</div>`)}
 else if(k==='learning'){const acts=(data.activities||[]).filter(a=>classFilter(a.Class)&&['yesno','choice','lesson'].includes(String(a.Type||'').toLowerCase()));frame('Learning Activities',`${!teacher?`<label>Class${clsSelect('aclass')}</label>`:''}<div class="actions"><button onclick="activityForm()">＋ Create Activity</button></div><div id="activityForm"></div><div class="list">${acts.map(a=>`<div class="entry"><strong>${esc(a.Title)}</strong><small>Class ${esc(a.Class)} · ${esc(a.Type)} · ${(a.responses||[]).length} responses</small><div class="actions"><button class="ghost" onclick="viewActivityResponses('${esc(a['Activity ID'])}')">View Responses</button><button class="ghost" onclick="editActivity('${esc(a['Activity ID'])}')">Edit</button><button class="danger" onclick="deleteActivity('${esc(a['Activity ID'])}')">Delete</button></div></div>`).join('')||'<p class="muted">No activities.</p>'}</div>`)}
}catch(e){say(e.message,true)}}
function entry(a,b){return `<div class="entry"><strong>${esc(a)}</strong><small>${esc(b)}</small></div>`}
function renderPrayerReport(){const cls=selectedClass('pclass'),students=(data.students||[]).filter(s=>String(s.Class)===cls),allRows=(data.prayers||[]).filter(p=>String(p.Class)===cls),keys=['Dhuhr','Asr','Maghrib','Isha','Fajr'];const dailyHost=$('dailyPrayerReport');if(dailyHost){const day=$('pdaily')?.value||'',fourCycleDay=day,fajrRows=allRows.filter(p=>dateKey(p['Cycle Date'])===day),fourRows=allRows.filter(p=>dateKey(p['Cycle Date'])===fourCycleDay);const mergeFlags=(rows,prayers)=>{const out={};rows.forEach(r=>{const id=String(r['Student ID']);if(!out[id])out[id]={};prayers.forEach(k=>out[id][k]=out[id][k]||truth(r[k]));});return out};const fourByStudent=mergeFlags(fourRows,['Dhuhr','Asr','Maghrib','Isha']),fajrByStudent=mergeFlags(fajrRows,['Fajr']);const displayDate=key=>{const x=key.split('-');return x.length===3?x[2]+'/'+x[1]+'/'+x[0]:key};dailyHost.innerHTML=`<div class="tablewrap"><table><tr><th>Student</th>${keys.map(k=>`<th>${k}<div class="muted">${displayDate(k==='Fajr'?day:shiftDateKey(day,-1))}</div></th>`).join('')}<th>Total</th></tr>${students.map(s=>{const id=String(s.ID),vals=['Dhuhr','Asr','Maghrib','Isha'].map(k=>!!fourByStudent[id]?.[k]).concat([!!fajrByStudent[id]?.Fajr]);return `<tr><td><b>${esc(s.Name)}</b><div class="muted">${esc(s.ID)}</div></td>${vals.map(v=>`<td><span class="pill" style="background:${v?'#e6f7ef':'#fff0f0'};color:${v?'#08785f':'#b42318'}">${v?'✓ Done':'—'}</span></td>`).join('')}<td><b>${vals.filter(Boolean).length}/5</b></td></tr>`}).join('')}</table></div><p class="muted">${fourRows.length+fajrRows.length} record(s) · Four prayers: ${displayDate(shiftDateKey(day,-1))} · Fajr: ${displayDate(day)}</p>`}const host=$('prayerReport');if(!host)return;const range=$('prange').value,month=$('pmonth').value;let rows=allRows;if(range==='month'&&month)rows=rows.filter(p=>dateKey(p['Cycle Date']).startsWith(month));let counts={};students.forEach(s=>{let mine=rows.filter(r=>String(r['Student ID'])===String(s.ID));counts[s.ID]=key function renderActivityFields(existing=window.editingActivity){const type=$('atype')?.value,host=$('activityTypeFields');if(!host)return;if(type==='yesno')host.innerHTML=`<label>Question<textarea id="acontent">${esc(existing?.Content||'')}</textarea></label><label>Correct Answer<select id="acorrect"><option value="">Choose correct answer</option><option ${existing?.['Correct Answer']==='അതെ'?'selected':''}>അതെ</option><option ${existing?.['Correct Answer']==='ഇല്ല'?'selected':''}>ഇല്ല</option></select></label>`;else if(type==='choice'){const opts=String(existing?.Options||'').split('|');host.innerHTML=`<label>Question<textarea id="acontent">${esc(existing?.Content||'')}</textarea></label><div class="formgrid">${[0,1,2,3].map(i=>`<label>Option ${i+1}<input id="aopt${i}" value="${esc(opts[i]||'')}"></label>`).join('')}</div><label>Correct Answer<select id="acorrect"><option value="">Choose correct option</option>${[0,1,2,3].map(i=>`<option value="${i}" ${String(existing?.['Correct Answer'])===String(i)?'selected':''}>Option ${i+1}</option>`).join('')}</select></label>`}else host.innerHTML=`<label>Lesson Heading / Content<textarea id="acontent" placeholder="Enter lesson content. Links may be included in the text.">${esc(existing?.Content||'')}</textarea></label>`}
async function saveActivity(id=''){const type=$('atype').value,options=type==='choice'?[0,1,2,3].map(i=>$('aopt'+i).value.trim()).join('|'):'';const correct=$('acorrect')?.value??'';if(type!=='lesson'&&!correct){say('Select the correct answer.',true);return}const payload={token,className:selectedClass('aclass'),type,title:$('atitle').value,content:$('acontent').value,options,correctAnswer:type==='choice'?options.split('|')[Number(correct)]:correct,dueDate:$('adue').value};const r=await api(id?'updateActivity':'saveActivity',{...payload,activityId:id});say(r.message,!r.ok);if(r.ok){await refresh();openPage('learning')}}
async function viewActivityResponses(id){const a=(data.activities||[]).find(x=>String(x['Activity ID'])===String(id));if(!a)return;const rows=a.responses||[];const host=$('activityForm');host.innerHTML=`<div class="section"><h3>Responses · ${esc(a.Title)}</h3><button class="back" onclick="openPage('learning')">← Back</button>${rows.map(r=>{const correct=String(r.Answer)===String(a['Correct Answer']);return `<div class="entry"><strong>${esc(r['Student Name'])} · Class ${esc(r.Class)}</strong><p>${esc(r.Answer)}</p><small>${esc(r['Submitted At'])} · ${a.Type==='lesson'?'Submitted':(correct?'Correct':'Incorrect')}</small></div>`}).join('')||'<p class="muted">No responses yet.</p>'}</div>`}
function editActivity(id){const a=(data.activities||[]).find(x=>String(x['Activity ID'])===String(id));if(a)activityForm(a)}
async function deleteActivity(id){if(!confirmDelete('Delete this activity? Existing responses will be retained.'))return;const r=await api('deleteActivity',{token,activityId:id});say(r.message,!r.ok);if(r.ok){await refresh();openPage('learning')}}
function programForm(){ $('programFormHost').innerHTML=`<div class="section">${!teacher?`<label>Class${clsSelect('programClass')}</label>`:''}<label>Program Type<select id="programType"><option value="mcq">MCQ Quiz Program</option><option value="descriptive">Descriptive Quiz Program</option></select></label><label>Program Title<input id="programTitle"></label><label>Questions (one per line; MCQ format: question|A|B|C|D|correct option)</label><textarea id="programQuestions"></textarea><button onclick="saveProgram()">Create Program</button></div>`}
async function saveProgram(){const r=await api('saveProgram',{token,className:selectedClass('programClass'),type:$('programType').value,title:$('programTitle').value,questions:$('programQuestions').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('programs')}}
async function viewProgramParticipants(id){const r=await api('programParticipants',{token,programId:id});if(!r.ok){say(r.message,true);return}const h=$('programFormHost');h.innerHTML=`<div class="section"><h3>Participants</h3>${r.participants.map(p=>`<div class="entry"><button class="ghost" onclick="viewProgramAnswers('${esc(id)}','${esc(p['Student ID'])}')">${esc(p['Student Name'])} · Class ${esc(p.Class)}</button><small>${esc(p['Submitted At'])}</small></div>`).join('')||'<p class="muted">No participants yet.</p>'}</div>`}
async function viewProgramAnswers(pid,sid){const r=await api('programStudentAnswers',{token,programId:pid,studentId:sid});if(!r.ok){say(r.message,true);return}$('programFormHost').innerHTML=`<div class="section"><h3>${esc(r.student['Student Name'])} · Class ${esc(r.student.Class)}</h3><small>${esc(r.student['Submitted At'])}</small>${r.answers.map(a=>`<div class="entry"><b>${esc(a.Question)}</b><p>${esc(a.Answer)}</p>${a['Correct Answer']?`<small>${String(a.Answer)===String(a['Correct Answer'])?'Correct':'Incorrect'}</small>`:''}</div>`).join('')}</div>`}
async function loadQR(){const r=await api('getQRLinks',{token});if(!r.ok)throw Error(r.message);const host=$('qrgrid');if(!host)return;host.innerHTML='';const list=[{name:'Sadr Muallim',url:r.superAdmin?.url},...(r.teachers||[]).map(x=>({name:'Class '+x.className+' · '+x.name,url:x.url}))];list.forEach(x=>{const d=document.createElement('div');d.className='qrCard';d.innerHTML=`<b>${esc(x.name)}</b><div class="qrbox"></div>`;host.appendChild(d);if(x.url&&window.QRCode)new QRCode(d.querySelector('.qrbox'),{text:x.url,width:120,height:120})})}
function say(t,e=false){$('msg').textContent=t;$('msg').classList.toggle('error',e)}boot();
</script></body></html>
